name: Build Sarfealam Auto-Studio APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract src & public from grok-workspace.zip
        run: |
          unzip -o grok-workspace.zip "src/*" "public/*"
          cat << 'EOF' > src/main.apk.tsx
          import { StrictMode } from "react";
          import { createRoot } from "react-dom/client";
          import { AuthProvider } from "@/lib/auth/provider";
          import { StudioApp } from "@/components/studio/StudioApp";
          import "./styles.css";

          createRoot(document.getElementById("root")!).render(
            <StrictMode>
              <AuthProvider>
                <StudioApp />
              </AuthProvider>
            </StrictMode>
          );
          EOF

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Build Web & Android APK
        run: |
          npm install --legacy-peer-deps
          npx vite build --config vite.apk.config.ts
          npm install --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Sarfealam Auto-Studio" "com.sarfealam.autostudio" --web-dir dist || true
          npx cap add android || true
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: sarfealam-auto-studio-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: Sarfealam Auto-Studio APK #${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
